<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1></h1>
    <button onclick="inc()">increase</button>
    <button onclick="dec()">decrease</button>


    <script>
        let h1 = document.querySelector("h1");
        var count = 0;
        h1.innerText = count;



        function updateColor() {
            if (count > 0) {
                h1.style.color = "green";
            }
            else if (count < 0) {
                h1.style.color = "red";
            }
            else {
                h1.style.color = "black";
            }
        }
        function inc() {

            count++;
            h1.innerText = count;
            updateColor()


        }
        function dec() {
            count--;
            h1.innerText = count;
            updateColor();

        }


    </script>
</body>

</html>
